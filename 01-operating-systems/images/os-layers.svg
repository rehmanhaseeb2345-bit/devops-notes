<svg xmlns="http://www.w3.org/2000/svg" width="820" height="420" viewBox="0 0 820 420" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="1" y="1" width="818" height="418" rx="16" fill="#ffffff" stroke="#d0d7de"/>
  <text x="40" y="42" font-size="21" font-weight="700" fill="#1f2328">The three layers</text>
  <text x="40" y="66" font-size="14" fill="#57606a">Apps never touch the hardware. They ask the OS, and the OS deals with the machine.</text>

  <!-- Applications -->
  <rect x="150" y="88" width="520" height="76" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="410" y="118" font-size="17" font-weight="700" fill="#1e3a8a" text-anchor="middle">Applications</text>
  <text x="410" y="142" font-size="14" fill="#3b5b86" text-anchor="middle">Chrome · VS Code · games</text>

  <!-- OS -->
  <rect x="120" y="196" width="580" height="96" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="410" y="226" font-size="17" font-weight="700" fill="#065f46" text-anchor="middle">Operating System</text>
  <text x="410" y="251" font-size="14" fill="#047857" text-anchor="middle" font-weight="700">Kernel = the core engine</text>
  <text x="410" y="273" font-size="13" fill="#059669" text-anchor="middle">manages memory · schedules the CPU · talks to devices via drivers</text>

  <!-- Hardware -->
  <rect x="150" y="324" width="520" height="72" rx="12" fill="#fff7ed" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="410" y="354" font-size="17" font-weight="700" fill="#92400e" text-anchor="middle">Hardware</text>
  <text x="410" y="378" font-size="14" fill="#b45309" text-anchor="middle">CPU · RAM · Disk</text>

  <!-- arrows down (asks) and up label -->
  <defs><marker id="d" viewBox="0 0 10 10" refX="5" refY="9" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1L5 9L9 1" fill="none" stroke="#64748b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
  <path d="M300 168V192" stroke="#64748b" stroke-width="1.8" marker-end="url(#d)"/>
  <text x="288" y="184" font-size="12" fill="#64748b" text-anchor="end">asks for resources</text>
  <path d="M520 296V320" stroke="#64748b" stroke-width="1.8" marker-end="url(#d)"/>
  <text x="532" y="312" font-size="12" fill="#64748b">controls hardware</text>
</svg>
