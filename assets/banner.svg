<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b2027"/>
      <stop offset="1" stop-color="#1c7d6f"/>
    </linearGradient>
    <linearGradient id="inf" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="320" rx="20" fill="url(#bg)"/>
  <!-- faint infinity motif -->
  <g opacity="0.10" fill="none" stroke="#ffffff" stroke-width="26" stroke-linecap="round">
    <path d="M980 220 C980 150, 1080 150, 1120 190 C1160 230, 1200 230, 1200 190 C1200 150, 1160 150, 1120 190 C1080 230, 980 230, 980 160"/>
  </g>
  <text x="64" y="138" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="62" font-weight="700" fill="#ffffff">DevOps Notes</text>
  <text x="66" y="184" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="23" fill="#cfeee7">Everything I'm learning about DevOps,</text>
  <text x="66" y="214" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="23" fill="#cfeee7">written in my own words.</text>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#ffffff">
    <rect x="66" y="242" width="185" height="32" rx="16" fill="#ffffff" fill-opacity="0.14"/>
    <text x="158" y="263" text-anchor="middle">TechWorld with Nana</text>
    <rect x="263" y="242" width="160" height="32" rx="16" fill="#ffffff" fill-opacity="0.14"/>
    <text x="343" y="263" text-anchor="middle">plain explanations</text>
    <rect x="435" y="242" width="130" height="32" rx="16" fill="#ffffff" fill-opacity="0.14"/>
    <text x="500" y="263" text-anchor="middle">diagrams</text>
  </g>
  <!-- terminal -->
  <rect x="812" y="70" width="404" height="180" rx="14" fill="#071318" stroke="#ffffff" stroke-opacity="0.15"/>
  <circle cx="838" cy="94" r="6" fill="#ff5f57"/>
  <circle cx="858" cy="94" r="6" fill="#febc2e"/>
  <circle cx="878" cy="94" r="6" fill="#28c840"/>
  <g font-family="Consolas, Menlo, monospace" font-size="18" xml:space="preserve">
    <text x="838" y="140"><tspan fill="#34d399">$</tspan><tspan fill="#e6edf3"> docker ps</tspan></text>
    <text x="838" y="172"><tspan fill="#34d399">$</tspan><tspan fill="#e6edf3"> kubectl get pods</tspan></text>
    <text x="838" y="204"><tspan fill="#34d399">$</tspan><tspan fill="#e6edf3"> terraform apply</tspan></text>
    <text x="838" y="228"><tspan fill="#7cc4ff">▋</tspan></text>
  </g>
</svg>
