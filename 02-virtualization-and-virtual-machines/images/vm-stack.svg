<svg xmlns="http://www.w3.org/2000/svg" width="820" height="440" viewBox="0 0 820 440" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="1" y="1" width="818" height="438" rx="16" fill="#ffffff" stroke="#d0d7de"/>
  <text x="40" y="42" font-size="21" font-weight="700" fill="#1f2328">The virtualization stack</text>
  <text x="40" y="66" font-size="14" fill="#57606a">One hypervisor slices the real hardware into several isolated virtual machines.</text>

  <!-- VMs -->
  <rect x="90" y="86" width="300" height="82" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="240" y="114" font-size="16" font-weight="700" fill="#1e3a8a" text-anchor="middle">VM 1</text>
  <text x="240" y="138" font-size="13" fill="#3b5b86" text-anchor="middle">Guest OS: Ubuntu</text>
  <text x="240" y="156" font-size="13" fill="#3b5b86" text-anchor="middle">+ App</text>
  <rect x="430" y="86" width="300" height="82" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="580" y="114" font-size="16" font-weight="700" fill="#1e3a8a" text-anchor="middle">VM 2</text>
  <text x="580" y="138" font-size="13" fill="#3b5b86" text-anchor="middle">Guest OS: Windows</text>
  <text x="580" y="156" font-size="13" fill="#3b5b86" text-anchor="middle">+ App</text>

  <!-- Hypervisor -->
  <rect x="90" y="196" width="640" height="70" rx="12" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="410" y="226" font-size="16" font-weight="700" fill="#5b21b6" text-anchor="middle">Hypervisor — e.g. VirtualBox</text>
  <text x="410" y="249" font-size="13" fill="#6d28d9" text-anchor="middle">shares the hardware between VMs and keeps them isolated</text>

  <!-- Host OS -->
  <rect x="90" y="294" width="640" height="54" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="410" y="327" font-size="15" font-weight="700" fill="#065f46" text-anchor="middle">Host OS — Windows / macOS</text>

  <!-- Hardware -->
  <rect x="90" y="366" width="640" height="54" rx="12" fill="#fff7ed" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="410" y="399" font-size="15" font-weight="700" fill="#92400e" text-anchor="middle">Physical Hardware — CPU · RAM · Disk</text>

  <defs><marker id="d2" viewBox="0 0 10 10" refX="5" refY="9" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1L5 9L9 1" fill="none" stroke="#94a3b8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
  <path d="M240 168V193" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#d2)"/>
  <path d="M580 168V193" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#d2)"/>
</svg>
